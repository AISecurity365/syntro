name: SEO AI Analyst (weekly)

on:
  schedule:
    - cron: '0 9 * * 1'   # Cada lunes 09:00 UTC (tras el informe GA4 plano)
  workflow_dispatch:        # Ejecución manual desde GitHub para probar

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run SEO AI analyst
        run: node scripts/seo-ai-analyst.mjs
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
