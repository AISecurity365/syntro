name: GA4 Weekly Report

on:
  # Cron DESACTIVADO (jul 2026) — sustituido por el analista IA (seo-ai-analyst.yml),
  # que ya incluye GA4 + Search Console + análisis. Queda solo el disparo manual.
  # schedule:
  #   - cron: '0 8 * * 1'   # Cada lunes a las 08:00 UTC
  workflow_dispatch:        # Ejecución manual desde GitHub si se necesita el informe plano

jobs:
  send-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run GA4 weekly report
        run: node scripts/ga4-weekly-report.mjs
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
