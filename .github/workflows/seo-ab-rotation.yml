name: SEO - Rotación A/B títulos y descripciones

on:
  # Cron DESACTIVADO (jul 2026) — evitar señal de "scaled content abuse" tras el
  # June 2026 Spam Update. La rotación automática de títulos/descripciones sin
  # revisión humana es el perfil que penalizan los spam updates. Se mantiene el
  # disparo manual; reactivar el cron solo con criterio editorial humano.
  # schedule:
  #   - cron: '0 9 1,15 * *'
  workflow_dispatch: # Ejecución manual desde GitHub

jobs:
  ab-rotation:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Ejecutar rotación A/B
        run: node scripts/seo-automation/3-ab-rotation.js --rotate

      - name: Commit y push si hay cambios
        run: |
          git config user.name "SEO Bot"
          git config user.email "bot@aisecurity.es"
          git add src/pages/blog/ scripts/seo-automation/ab-state.json
          if git diff --staged --quiet; then
            echo "Sin cambios, nada que commitear"
          else
            git commit -m "chore: rotación A/B títulos y descripciones [SEO auto]"
            git push
          fi
