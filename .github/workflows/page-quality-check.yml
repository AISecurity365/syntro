name: 🤖 SEO/GEO Auto-fix

# DESACTIVADO (28-jul-2026) — solo manual (workflow_dispatch).
# Motivo: reescribía titulares a formato pregunta de forma indiscriminada (incluidas
# etiquetas de tarjeta y pasos numerados) y los cambios de heading se auto-commiteaban
# saltándose la revalidación. Las reglas que SÍ aplicaba bien (longitudes de title y
# description, keyword al inicio) están ahora en docs/seo/README.md para aplicarlas a mano.
# Antes de reactivar el trigger de push: revisar .github/scripts/seo-autofix.cjs y validar
# varias ejecuciones en manual.
on:
  workflow_dispatch:

# Necesario para que el bot pueda commitear las mejoras
permissions:
  contents: write

jobs:
  autofix:
    name: Detectar y auto-mejorar SEO/GEO
    runs-on: ubuntu-latest
    # (La guarda contra bucles del propio bot ya no aplica: sin trigger de push
    #  no puede re-dispararse. head_commit no existe en workflow_dispatch.)

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Detectar páginas modificadas
        id: changed
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD -- 'src/pages/' 2>/dev/null \
            | grep '\.astro$' \
            | grep -v '/api/' \
            | grep -v '/_' \
            || true)
          echo "Páginas detectadas:"
          echo "${CHANGED:-ninguna}"
          {
            echo "files<<EOF"
            echo "$CHANGED"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Nada que analizar → salir
        if: steps.changed.outputs.files == ''
        run: echo "No hay páginas .astro modificadas fuera de /api/ — saliendo."

      - name: Analizar y auto-mejorar (IA + deterministas)
        if: steps.changed.outputs.files != ''
        env:
          CHANGED_FILES: ${{ steps.changed.outputs.files }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_TO: julen.sistemas@gmail.com
        run: node .github/scripts/seo-autofix.cjs
