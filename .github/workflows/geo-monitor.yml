name: GEO Monitor - citación Wazuh en IA

on:
  workflow_dispatch: # Ejecución manual desde GitHub / gh CLI
  # Opcional a futuro: descomentar para snapshot mensual (no muta contenido del sitio).
  # schedule:
  #   - cron: '0 7 1 * *'

jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Ejecutar geo-monitor (DeepSeek)
        run: node scripts/geo-monitor/check.mjs
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

      - name: Commit informe si hay cambios
        run: |
          git config user.name "GEO Monitor Bot"
          git config user.email "bot@aisecurity.es"
          git add scripts/geo-monitor/history.json scripts/geo-monitor/last-report.md
          if git diff --staged --quiet; then
            echo "Sin cambios en el informe"
          else
            git commit -m "chore: snapshot geo-monitor citación Wazuh [auto]"
            git push
          fi
